[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agi-platform"
version = "0.1.0"
description = "AGI research and engineering platform (vertical slice)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6,<3",
  "typer>=0.12,<1",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agi = "agi.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = ["slow: slow tests", "network: requires network"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["src/agi"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 63
show_missing = true
